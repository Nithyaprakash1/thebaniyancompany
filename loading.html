<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>THE BANIYAN COMPANY — Loading</title>
  <link rel="icon" type="image/jpeg" href="tbclogo.jpeg">
  <link rel="shortcut icon" href="tbclogo.jpeg">
  <meta name="description" content="Loading THE BANIYAN COMPANY — Premium Clothing & Essentials.">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f9f9f9;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Full-screen splash ── */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: #f9f9f9;
      z-index: 10;
      opacity: 1;
      transition: opacity 0.7s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    /* Logo */
    .splash-logo {
      height: 56px;
      object-fit: contain;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.7s ease 0.2s forwards;
    }

    /* Brand name */
    .splash-brand {
      margin-top: 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #5e5e5e;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.45s forwards;
    }

    /* Tagline */
    .splash-tagline {
      margin-top: 8px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #b0b0b0;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.65s forwards;
    }

    /* Loading bar */
    .loading-bar-wrap {
      margin-top: 40px;
      width: 160px;
      height: 3px;
      background: #e2e2e2;
      border-radius: 999px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.85s forwards;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #000;
      border-radius: 999px;
      animation: fillBar 1.8s cubic-bezier(0.4, 0, 0.2, 1) 1s forwards;
    }

    /* Percentage counter */
    .loading-percent {
      margin-top: 12px;
      font-size: 10px;
      font-weight: 600;
      color: #b0b0b0;
      letter-spacing: 0.1em;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.9s forwards;
    }

    /* Decorative dots */
    .dots-row {
      display: flex;
      gap: 6px;
      margin-top: 32px;
      opacity: 0;
      animation: fadeUp 0.5s ease 1s forwards;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d0d0d0;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fillBar {
      0%   { width: 0%; }
      60%  { width: 70%; }
      85%  { width: 92%; }
      100% { width: 100%; }
    }
    @keyframes pulse {
      0%, 100% { background: #d0d0d0; transform: scale(1); }
      50%       { background: #000; transform: scale(1.3); }
    }

    /* Bottom text */
    .splash-footer {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 24px);
      bottom: max(env(safe-area-inset-bottom), 24px);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c8c8c8;
      opacity: 0;
      animation: fadeUp 0.5s ease 1.2s forwards;
    }
  </style>
</head>
<body>

<div id="splash">
  <!-- Logo -->
  <img
    id="splash-company-logo"
    class="splash-logo"
    src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'><rect width='160' height='160' rx='36' fill='%23000000'/><text x='80' y='95' font-family='system-ui,sans-serif' font-weight='900' font-size='48' fill='%23ffffff' text-anchor='middle' letter-spacing='4'>TBC</text></svg>"
    alt="THE BANIYAN COMPANY"
  >

  <span class="splash-brand">The Baniyan Company</span>
  <span class="splash-tagline">Affordable · Essentials · Streetwear</span>

  <!-- Progress bar -->
  <div class="loading-bar-wrap">
    <div class="loading-bar-fill" id="bar"></div>
  </div>
  <span class="loading-percent" id="pct">0%</span>

  <!-- Animated dots -->
  <div class="dots-row">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <!-- Footer label -->
  <span class="splash-footer">Summer Collection 2026</span>
</div>

<script>
  // Animate the percentage counter in sync with the CSS bar fill
  (function () {
    const pct = document.getElementById('pct');
    let current = 0;

    // Start counting after the bar animation begins (1s delay to match CSS)
    setTimeout(() => {
      // Total fill time ~1800ms. We'll tick every ~18ms to reach 100 in ~1800ms
      const interval = setInterval(() => {
        // Ease: faster in the middle, slower at start/end — mirror fillBar keyframes
        if (current < 70) {
          current += 1.9;          // fast phase
        } else if (current < 92) {
          current += 0.7;          // slow phase
        } else if (current < 100) {
          current += 0.4;          // crawl to finish
        }
        if (current >= 100) {
          current = 100;
          clearInterval(interval);
        }
        pct.textContent = Math.round(current) + '%';
      }, 18);
    }, 1000);
  })();

  // Read the ?next= param to know where to redirect after loading
  function getNextPage() {
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    if (next && !next.startsWith('http') && !next.startsWith('//') && next.includes('.html')) {
      return next;
    }
    return 'home.html';
  }

  // Instant redirect (0s delay) to the next page
  window.addEventListener('load', () => {
    const dest = getNextPage();
    window.location.href = dest;
  });
</script>
</body>
</html>
