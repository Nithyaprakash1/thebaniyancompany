<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>THE BANIYAN COMPANY — Loading</title>
  <link rel="icon" type="image/png" href="assets/onespace-commerce-logo.png">
  <link rel="shortcut icon" href="assets/onespace-commerce-logo.png">
  <link rel="apple-touch-icon" href="assets/onespace-commerce-logo.png">
  <meta name="description" content="Loading THE BANIYAN COMPANY — Premium Clothing & Essentials.">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      text-transform: uppercase;
    }

    .material-symbols-outlined,
    .material-symbols-rounded,
    .material-icons,
    svg,
    script,
    style {
      text-transform: none !important;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #f9f9f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Full-screen splash ── */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s ease;
      cursor: pointer;
    }
    #splash.fade-out {
      opacity: 0;
      transform: scale(0.985);
      pointer-events: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 90%;
      max-width: 320px;
    }

    /* Logo */
    .splash-logo {
      height: 52px;
      width: auto;
      object-fit: contain;
      border-radius: 12px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }

    /* Brand name */
    .splash-brand {
      margin-top: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #1a1a1a;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Tagline */
    .splash-tagline {
      margin-top: 5px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #767676;
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    /* Loading bar wrapper */
    .loading-bar-wrap {
      margin-top: 36px;
      width: 180px;
      height: 4px;
      background: #e5e5e5;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.04);
      animation: fadeUp 0.5s ease 0.35s forwards;
    }

    /* Loading bar fill */
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #000000;
      border-radius: 999px;
      transition: width 0.08s linear;
      position: relative;
    }

    /* Loading bar shimmer reflection */
    .loading-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 24px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    }

    /* Percentage & status */
    .loading-meta {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.4s forwards;
    }

    .loading-percent {
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #111111;
      letter-spacing: 0.08em;
    }

    .loading-status {
      font-size: 9.5px;
      font-weight: 500;
      color: #8c8c8c;
      letter-spacing: 0.05em;
    }

    /* Decorative pulse dots */
    .dots-row {
      display: flex;
      gap: 6px;
      margin-top: 24px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.45s forwards;
    }
    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d4d4d4;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* Skip notice */
    .skip-hint {
      margin-top: 18px;
      font-size: 8.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #b8b8b8;
      opacity: 0;
      animation: fadeUp 0.5s ease 1.2s forwards;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { background: #d4d4d4; transform: scale(1); }
      50%       { background: #000; transform: scale(1.4); }
    }

    /* Bottom footer */
    .splash-footer {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b0b0b0;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.6s forwards;
    }
  </style>
</head>
<body>

<div id="splash" title="Click to skip">
  <div class="splash-container">
    <!-- Logo -->
    <img
      id="splash-company-logo"
      class="splash-logo"
      src="assets/onespace-commerce-logo.png"
      onerror="this.src='assets/Onespace Commerce Logo PNG.png'"
      alt="OneSpaceCommerce Logo"
    >

    <span class="splash-brand">The Baniyan Company</span>
    <span class="splash-tagline">Affordable · Essentials · Streetwear</span>

    <!-- Progress bar -->
    <div class="loading-bar-wrap">
      <div class="loading-bar-fill" id="bar"></div>
    </div>

    <!-- Percentage counter & status text -->
    <div class="loading-meta">
      <span class="loading-percent" id="pct">0%</span>
      <span class="loading-status" id="status-text">Loading catalog...</span>
    </div>

    <!-- Animated dots -->
    <div class="dots-row">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <span class="skip-hint">Tap anywhere to skip</span>
  </div>

  <!-- Footer label -->
  <span class="splash-footer">Summer Collection 2026</span>
</div>

<script>
  (function () {
    const splash = document.getElementById('splash');
    const bar = document.getElementById('bar');
    const pct = document.getElementById('pct');
    const statusText = document.getElementById('status-text');

    // Determine target URL
    function getNextPage() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      if (next && !next.startsWith('http://') && !next.startsWith('https://') && !next.startsWith('//')) {
        return next;
      }
      return 'home';
    }

    const destination = getNextPage();

    // Prefetch destination in background for lightning-fast arrival
    try {
      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = destination;
      document.head.appendChild(link);
    } catch (e) {}

    let current = 0;
    let target = 25;
    let redirected = false;

    function redirectToTarget() {
      if (redirected) return;
      redirected = true;
      splash.classList.add('fade-out');
      setTimeout(() => {
        window.location.replace(destination);
      }, 350);
    }

    // Skip on click / tap
    splash.addEventListener('click', () => {
      current = 100;
      bar.style.width = '100%';
      pct.textContent = '100%';
      redirectToTarget();
    });

    const statusStages = [
      { at: 20, text: 'Fetching collections...' },
      { at: 55, text: 'Loading product catalog...' },
      { at: 80, text: 'Preparing essentials...' },
      { at: 98, text: 'Almost ready...' }
    ];

    function updateStatus(val) {
      for (let i = statusStages.length - 1; i >= 0; i--) {
        if (val >= statusStages[i].at) {
          statusText.textContent = statusStages[i].text;
          break;
        }
      }
    }

    // Stage progression increments
    const timer = setInterval(() => {
      if (target < 50) {
        target = 50 + Math.random() * 15;
      } else if (target < 85) {
        target = 85 + Math.random() * 10;
      } else if (target < 99) {
        target = 99;
      }
    }, 280);

    // High frequency renderer for buttery smooth 0% -> 100% animation
    const startTime = performance.now();
    const duration = 1800; // ~1.8 seconds total smooth cinematic progression

    function render(time) {
      if (redirected) return;

      const elapsed = time - startTime;
      const progressRatio = Math.min(1, elapsed / duration);

      // Smooth custom easing
      const plannedPct = progressRatio * 100;
      
      if (progressRatio >= 1) {
        current = 100;
      } else {
        // Follow highest of time-based ramp and target
        current = Math.min(99, Math.max(current + 0.5, plannedPct));
      }

      bar.style.width = current.toFixed(1) + '%';
      pct.textContent = Math.round(current) + '%';
      updateStatus(current);

      if (current >= 100) {
        clearInterval(timer);
        bar.style.width = '100%';
        pct.textContent = '100%';
        statusText.textContent = 'Ready!';
        setTimeout(redirectToTarget, 150);
        return;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);

    // Failsafe max timeout
    setTimeout(redirectToTarget, 3000);
  })();
</script>
</body>
</html>
