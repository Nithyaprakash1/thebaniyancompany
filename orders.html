    window.liveOrders = [...DEMO_ORDERS];
    window.activeOrderStatusFilter = 'all';
    window.activeOrderSearch = '';

    // Load from Firestore
    async function loadOrdersFromFirestore() {
      try {
        const snap = await getDocs(collection(db, 'companies', COMPANY_ID, 'invoices'));
        if (!snap.empty) {
          const list = snap.docs.map(d => {
            const data = d.data();
            let dateText = '';
            if (data.createdAt?.seconds) {
              const dt = new Date(data.createdAt.seconds * 1000);
              dateText = dt.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
            } else if (data.orderDateStr) {
              dateText = data.orderDateStr;
            } else {
              dateText = new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
            }

            return {
              id: d.id,
              customerName: data.customerName || data.customerDetails?.name || 'Customer',
              phone: data.customerPhoneNumber || data.customerPhone || 'Not provided',
              email: data.customerEmail || '',
              address: data.customerAddress || data.customerDetails?.address || '',
              city: data.city || data.customerDetails?.city || '',
              state: data.state || data.customerDetails?.state || '',
              pincode: data.pincode || data.customerDetails?.pincode || '',
              totalAmount: Number(data.totalAmount || 0),
              paymentMethod: data.paymentMethod || 'Online',
              paymentStatus: data.paymentStatus || 'Paid',
              status: data.status || 'Pending',
              createdAtFormatted: dateText,
              createdAtTimestamp: data.createdAt?.seconds ? data.createdAt.seconds * 1000 : Date.now(),
              items: data.items || []
            };
          });

          if (list.length > 0) {
            window.liveOrders = list;
          }
        }
      } catch (err) {
        console.warn('Using baseline demo orders:', err);
      }

      applyOrderFilters();
    }

    // Format badge based on status
    function getStatusBadge(status) {
      const s = String(status || '').toLowerCase();
      if (s === 'pending') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">Pending Acceptance</span>`;
      } else if (s === 'accepted') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-sky-50 text-sky-700 border border-sky-200">Accepted</span>`;
      } else if (s === 'packing') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 border border-purple-200">Packing</span>`;
      } else if (s === 'shipped') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">Shipped</span>`;
      } else if (s === 'delivered') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Delivered</span>`;
      } else if (s === 'cancelled') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">Cancelled</span>`;
      } else if (s === 'returned') {
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-orange-50 text-orange-700 border border-orange-200">Returned</span>`;
      }
      return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">${status}</span>`;
    }

    // Render Orders Cards
    function renderOrdersView(orders) {
      const container = document.getElementById('orders-cards-container');
      const emptyState = document.getElementById('orders-empty-state');
      if (!container) return;

      if (!orders || orders.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = orders.map(o => {
        const isPaid = (o.paymentStatus === 'Paid') || String(o.paymentMethod || '').toLowerCase().includes('razorpay');
        const payBadge = isPaid 
          ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-md border border-emerald-200">PAID (${o.paymentMethod})</span>`
          : `<span class="inline-flex items-center gap-1 text-[11px] font-semibold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-md border border-amber-200">${o.paymentMethod}</span>`;

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-xs space-y-4 hover:border-slate-300 transition">
            
            <!-- Card Header: ID, Date & Time, Status Badge -->

                <span class="font-mono text-xs font-bold bg-slate-100 text-slate-800 px-2.5 py-1 rounded-lg">
                  ${o.id}
                </span>
                
                <!-- PROMINENT DATE WITH TIME -->

                  <i data-lucide="calendar" class="w-3.5 h-3.5 text-slate-400"></i>
                  <span>${o.createdAtFormatted}</span>
                </div>
              </div>

              <div class="flex items-center gap-2">
                ${payBadge}
                ${getStatusBadge(o.status)}
              </div>
            </div>

            <!-- Customer & Delivery Address Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              
              <!-- Customer Info -->
              <div class="space-y-1">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Customer</span>
                <h4 class="font-bold text-slate-900 text-sm">${o.customerName}</h4>
                <p class="text-slate-600 flex items-center gap-1">
                  <i data-lucide="phone" class="w-3 h-3 text-slate-400"></i>
                  <span>${o.phone}</span>
                </p>
                ${o.email ? `<p class="text-slate-400">${o.email}</p>` : ''}
              </div>

              <!-- Shipping Address -->
              <div class="space-y-1 md:col-span-2">
                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Delivery Address</span>
                <p class="text-slate-700 font-medium leading-relaxed">
                  ${o.address}, ${o.city ? o.city + ', ' : ''}${o.state ? o.state + ' - ' : ''}<strong>${o.pincode}</strong>
                </p>
              </div>
            </div>

            <!-- Ordered Items List -->
            <div class="p-3 bg-slate-50/70 border border-slate-100 rounded-xl space-y-2">
              <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Items in Order (${(o.items || []).length})</span>
              <div class="divide-y divide-slate-100">
                ${(o.items || []).map(i => `
                  <div class="flex items-center justify-between py-2 text-xs">
                    <div class="flex items-center gap-2.5">
                      <img src="${i.imageUrl || 'https://placehold.co/80x100?text=Product'}" class="w-9 h-11 object-cover rounded-lg bg-white border border-slate-200">
                      <div>
                        <span class="font-bold text-slate-800">${i.name}</span>
                        <span class="text-[11px] text-slate-500 block">Size: ${i.size || 'M'} · Color: ${i.color || 'Standard'} · Qty: ${i.qty || 1}</span>
                      </div>
                    </div>
                    <span class="font-bold text-slate-900">₹${Number(i.price || 0).toLocaleString('en-IN')}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Card Footer: Total Amount & Status Actions -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pt-2">
              <div class="flex items-baseline gap-2">
                <span class="text-xs text-slate-500">Order Total:</span>
                <span class="text-lg font-bold text-slate-900">₹${Number(o.totalAmount || 0).toLocaleString('en-IN')}</span>
              </div>

              <!-- Status Change Action Buttons -->
              <div class="flex items-center gap-1.5 flex-wrap">
                ${renderStatusActionButtons(o.id, o.status)}
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function renderStatusActionButtons(orderId, currentStatus) {
      const s = String(currentStatus || '').toLowerCase();
      let html = '';

      if (s === 'pending') {
        html += `<button onclick="updateOrderStatus('${orderId}', 'Accepted')" class="px-3 py-1.5 bg-black hover:bg-neutral-800 text-white font-semibold rounded-lg text-xs transition cursor-pointer">Accept Order</button>`;
        html += `<button onclick="updateOrderStatus('${orderId}', 'Cancelled')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-lg text-xs border border-rose-200 transition cursor-pointer">Cancel</button>`;
      } else if (s === 'accepted') {
        html += `<button onclick="updateOrderStatus('${orderId}', 'Packing')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg text-xs transition cursor-pointer">Mark Packing</button>`;
      } else if (s === 'packing') {
        html += `<button onclick="updateOrderStatus('${orderId}', 'Shipped')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-xs transition cursor-pointer">Mark Shipped</button>`;
      } else if (s === 'shipped') {
        html += `<button onclick="updateOrderStatus('${orderId}', 'Delivered')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs transition cursor-pointer">Mark Delivered</button>`;
        html += `<button onclick="updateOrderStatus('${orderId}', 'Returned')" class="px-3 py-1.5 bg-orange-50 hover:bg-orange-100 text-orange-700 font-semibold rounded-lg text-xs border border-orange-200 transition cursor-pointer">Mark Returned</button>`;
      } else if (s === 'delivered') {
        html += `<button onclick="updateOrderStatus('${orderId}', 'Returned')" class="px-3 py-1.5 bg-orange-50 hover:bg-orange-100 text-orange-700 font-semibold rounded-lg text-xs border border-orange-200 transition cursor-pointer">Return / Refund</button>`;
      }

      return html;
    }

    // Update Status Handler
    window.updateOrderStatus = async function(orderId, newStatus) {
      const order = window.liveOrders.find(o => o.id === orderId);
      if (!order) return;

      order.status = newStatus;
      applyOrderFilters();

      try {
        const orderRef = doc(db, 'companies', COMPANY_ID, 'invoices', orderId);
        await updateDoc(orderRef, {
          status: newStatus,
          updatedAt: serverTimestamp()
        });
      } catch (e) {
        console.log('Order status updated locally in state:', e);
      }
    };

    // Filter Logic
    window.applyOrderFilters = function() {
      const statusFilter = window.activeOrderStatusFilter || 'all';
      const search = (window.activeOrderSearch || '').trim().toLowerCase();
      const paymentFilter = document.getElementById('order-payment-filter')?.value || 'all';
      const sortFilter = document.getElementById('order-sort-filter')?.value || 'newest';

      let filtered = [...window.liveOrders];

      // Update counters for all 8 tabs
      updateTabCounters();

      // 1. Status Filter
      if (statusFilter !== 'all') {
        filtered = filtered.filter(o => String(o.status || '').toLowerCase() === statusFilter.toLowerCase());
      }

      // 2. Search
      if (search) {
        filtered = filtered.filter(o => 
          String(o.id || '').toLowerCase().includes(search) ||
          String(o.customerName || '').toLowerCase().includes(search) ||
          String(o.phone || '').includes(search) ||
          String(o.city || '').toLowerCase().includes(search)
        );
      }

      // 3. Payment
      if (paymentFilter !== 'all') {
        if (paymentFilter === 'paid') filtered = filtered.filter(o => o.paymentStatus === 'Paid' || String(o.paymentMethod || '').toLowerCase().includes('razorpay'));
        else if (paymentFilter === 'cod') filtered = filtered.filter(o => String(o.paymentMethod || '').toLowerCase().includes('cod') || o.paymentStatus !== 'Paid');
        else if (paymentFilter === 'whatsapp') filtered = filtered.filter(o => String(o.paymentMethod || '').toLowerCase().includes('whatsapp'));
      }

      // 4. Sort
      if (sortFilter === 'newest') filtered.sort((a, b) => (b.createdAtTimestamp || 0) - (a.createdAtTimestamp || 0));
      else if (sortFilter === 'oldest') filtered.sort((a, b) => (a.createdAtTimestamp || 0) - (b.createdAtTimestamp || 0));
      else if (sortFilter === 'amount_high') filtered.sort((a, b) => (b.totalAmount || 0) - (a.totalAmount || 0));
      else if (sortFilter === 'amount_low') filtered.sort((a, b) => (a.totalAmount || 0) - (b.totalAmount || 0));

      renderOrdersView(filtered);
    };

    function updateTabCounters() {
      const all = window.liveOrders;
      const countFor = (st) => all.filter(o => String(o.status || '').toLowerCase() === st.toLowerCase()).length;

      document.getElementById('count-all').textContent = all.length;
      document.getElementById('count-pending').textContent = countFor('pending');
      document.getElementById('count-accepted').textContent = countFor('accepted');
      document.getElementById('count-packing').textContent = countFor('packing');
      document.getElementById('count-shipped').textContent = countFor('shipped');
      document.getElementById('count-delivered').textContent = countFor('delivered');
      document.getElementById('count-cancelled').textContent = countFor('cancelled');
      document.getElementById('count-returned').textContent = countFor('returned');
    }

    window.setOrderStatusFilter = function(status) {
      window.activeOrderStatusFilter = status;
      document.querySelectorAll('.order-tab-btn').forEach(btn => {
        btn.classList.remove('bg-black', 'text-white', 'font-semibold');
        btn.classList.add('bg-slate-100', 'text-slate-600', 'font-medium');
      });

      const active = document.getElementById(`btn-status-${status}`);
      if (active) {
        active.classList.remove('bg-slate-100', 'text-slate-600', 'font-medium');
        active.classList.add('bg-black', 'text-white', 'font-semibold');
      }

      applyOrderFilters();
    };

    window.handleSearchOrders = function(val) {
      window.activeOrderSearch = val;
      const g = document.getElementById('global-order-search');
      const t = document.getElementById('table-order-search');
      if (g && g.value !== val) g.value = val;
      if (t && t.value !== val) t.value = val;
      applyOrderFilters();
    };

    window.refreshOrdersFeed = function() {
      loadOrdersFromFirestore();
    };

    window.addEventListener('DOMContentLoaded', loadOrdersFromFirestore);
  </script>
</body>
</html>
