<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Manual Order | The Baniyan Company</title>
  <link rel="icon" type="image/png" href="assets/onespace-commerce-logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .step-badge {
      width: 20px;
      height: 20px;
      border-radius: 9999px;
      background-color: #000000;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .custom-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02), 0 1px 2px -1px rgba(0, 0, 0, 0.02);
    }
    .custom-input, .custom-select {
      width: 100%;
      height: 40px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 13px;
      color: #0f172a;
      outline: none;
      transition: all 0.15s ease;
    }
    .custom-input:focus, .custom-select:focus {
      border-color: #000000;
      box-shadow: 0 0 0 1px #000000;
    }
    .custom-input::placeholder {
      color: #94a3b8;
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen py-6 sm:py-8 px-3.5 sm:px-6">

  <div class="max-w-2xl mx-auto space-y-5 sm:space-y-6">

    <!-- Top Navigation: Back to Orders -->
    <div>
      <a href="orders.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 transition-colors mb-2.5">
        <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Orders
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Create Manual Order</h1>
      <p class="text-xs text-slate-500 mt-0.5">For phone, WhatsApp, Instagram, or walk-in orders.</p>
    </div>

    <!-- MAIN FORM -->
    <form id="manual-order-form" onsubmit="handleOrderSubmit(event)" class="space-y-4">

      <!-- ================= 1. CUSTOMER DETAILS ================= -->
      <div class="custom-card p-4 sm:p-6 space-y-4">
        <div class="flex items-center gap-2.5">
          <span class="step-badge">1</span>
          <h2 class="font-bold text-sm text-slate-900">Customer Details</h2>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Customer Name</label>
            <input type="text" id="customer-name" placeholder="Priya Nair" required class="custom-input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
            <input type="tel" id="customer-phone" placeholder="9876543210" required pattern="[0-9]{10}" maxlength="10" class="custom-input">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Delivery Address</label>
          <input type="text" id="customer-address" placeholder="Full address with pincode" required class="custom-input">
        </div>
      </div>

      <!-- ================= 2. PRODUCTS ================= -->
      <div class="custom-card p-4 sm:p-6 space-y-3.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <span class="step-badge">2</span>
            <h2 class="font-bold text-sm text-slate-900">Products</h2>
          </div>
          <span id="catalog-loading-badge" class="inline-flex items-center gap-1.5 text-[11px] font-medium text-slate-400">
            <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse"></span> Loading catalog...
          </span>
        </div>

        <!-- Shimmer Skeleton Loading Placeholder -->
        <div id="products-shimmer" class="p-3.5 sm:p-4 rounded-xl bg-slate-50 border border-slate-100 space-y-3">
          <div class="flex items-center gap-2 text-[11px] font-semibold text-slate-500 px-0.5">
            <div class="flex-[5] min-w-0"><div class="h-3.5 w-16 skeleton-shimmer rounded"></div></div>
            <div class="flex-[2.5] min-w-0"><div class="h-3.5 w-10 skeleton-shimmer rounded"></div></div>
            <div class="flex-[2] min-w-0 flex justify-center"><div class="h-3.5 w-8 skeleton-shimmer rounded"></div></div>
            <div class="w-9 shrink-0"></div>
          </div>
          <div class="flex items-center gap-2">
            <div class="flex-[5] min-w-0"><div class="h-10 skeleton-shimmer rounded-lg"></div></div>
            <div class="flex-[2.5] min-w-0"><div class="h-10 skeleton-shimmer rounded-lg"></div></div>
            <div class="flex-[2] min-w-0"><div class="h-10 skeleton-shimmer rounded-lg"></div></div>
            <div class="w-9 shrink-0 flex justify-center"><div class="h-9 w-9 skeleton-shimmer rounded-lg"></div></div>
          </div>
        </div>

        <!-- Shaded Products Box (Matching Exact Reference Screenshot) -->
        <div id="products-box" class="hidden p-3.5 sm:p-4 rounded-xl bg-slate-50 border border-slate-100 space-y-2.5">
          <!-- Column Headers: Product, Size, Qty aligned with inputs -->
          <div class="flex items-center gap-2 text-[11px] font-semibold text-slate-500 px-0.5">
            <div class="flex-[5] min-w-0">Product</div>
            <div class="flex-[2.5] min-w-0">Size</div>
            <div class="flex-[2] min-w-0 text-center">Qty</div>
            <div class="w-9 shrink-0"></div>
          </div>

          <!-- Product Rows Container -->
          <div id="product-rows-container" class="space-y-2">
            <!-- Dynamic product rows -->
          </div>
        </div>

        <div>
          <button type="button" onclick="addProductRow()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-800 hover:text-black py-1 cursor-pointer transition-colors">
            <span class="text-sm font-bold leading-none">+</span> Add another product
          </button>
        </div>
      </div>

      <!-- ================= 3. PAYMENT ================= -->
      <div class="custom-card p-4 sm:p-6 space-y-4">
        <div class="flex items-center gap-2.5">
          <span class="step-badge">3</span>
          <h2 class="font-bold text-sm text-slate-900">Payment</h2>
        </div>

        <!-- Payment Method Toggle Pills -->
        <div class="flex items-center gap-2 flex-wrap" id="payment-method-group">
          <button type="button" onclick="setPaymentMethod('COD')" class="pay-pill px-4 h-9 rounded-xl text-xs font-bold transition-all bg-black text-white shadow-xs" data-method="COD">COD</button>
          <button type="button" onclick="setPaymentMethod('UPI')" class="pay-pill px-4 h-9 rounded-xl text-xs font-medium transition-all bg-white text-slate-700 border border-slate-200 hover:bg-slate-50" data-method="UPI">UPI</button>
          <button type="button" onclick="setPaymentMethod('Razorpay')" class="pay-pill px-4 h-9 rounded-xl text-xs font-medium transition-all bg-white text-slate-700 border border-slate-200 hover:bg-slate-50" data-method="Razorpay">Razorpay</button>
          <button type="button" onclick="setPaymentMethod('WhatsApp')" class="pay-pill px-4 h-9 rounded-xl text-xs font-medium transition-all bg-white text-slate-700 border border-slate-200 hover:bg-slate-50" data-method="WhatsApp">WhatsApp</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Delivery Charge (₹)</label>
            <input type="number" id="delivery-charge" value="70" min="0" oninput="recalculateSummary()" class="custom-input">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Discount (₹)</label>
            <input type="number" id="discount-amount" value="0" min="0" oninput="recalculateSummary()" class="custom-input">
          </div>
        </div>
      </div>

      <!-- ================= ORDER SUMMARY CARD ================= -->
      <div class="custom-card p-4 sm:p-6 space-y-3">
        <h3 class="font-bold text-sm text-slate-900">Order Summary</h3>

        <div class="space-y-2 text-xs">
          <div class="flex justify-between items-center text-slate-600">
            <span>Subtotal</span>
            <span class="font-medium text-slate-900" id="summary-subtotal">₹0</span>
          </div>
          <div class="flex justify-between items-center text-slate-600">
            <span>Delivery</span>
            <span class="font-medium text-slate-900" id="summary-delivery">₹70</span>
          </div>
          <div class="flex justify-between items-center text-slate-600">
            <span>Discount</span>
            <span class="font-medium text-emerald-600" id="summary-discount">-₹0</span>
          </div>
          <div class="border-t border-slate-100 pt-2.5 flex justify-between items-center">
            <span class="font-bold text-sm text-slate-900">Total</span>
            <span class="font-extrabold text-base sm:text-lg text-slate-900" id="summary-total">₹70</span>
          </div>
        </div>
      </div>

      <!-- BOTTOM ACTIONS -->
      <div class="flex items-center justify-end gap-3 pt-1">
        <a href="orders.html" class="px-5 h-10 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs font-semibold transition-all inline-flex items-center justify-center">
          Cancel
        </a>
        <button type="submit" id="save-order-btn" class="px-6 h-10 rounded-xl bg-black hover:bg-neutral-800 text-white text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer">
          <span>Save Order</span>
        </button>
      </div>

    </form>
  </div>

  <!-- FIREBASE & LOGIC -->
  <script type="module">
    import { getProducts, saveOrderToFirestore, COMPANY_ID } from './js/products-service.js';

    let catalog = [];
    let activePaymentMethod = 'COD';
    let rowCounter = 0;

    // Load Catalog with Shimmer and Cache Fallback
    async function initPage() {
      const shimmerEl = document.getElementById('products-shimmer');
      const boxEl = document.getElementById('products-box');
      const badgeEl = document.getElementById('catalog-loading-badge');

      try {
        // 1. Try instant cache for 0ms render
        const cachedRaw = localStorage.getItem('tbc_cache_products') || sessionStorage.getItem(`ecommerce_products_${COMPANY_ID}`);
        if (cachedRaw) {
          try {
            const parsed = JSON.parse(cachedRaw);
            const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.data) ? parsed.data : []);
            if (list.length > 0) catalog = list;
          } catch (_) {}
        }

        // 2. Fetch fresh catalog if cache was empty
        if (catalog.length === 0) {
          catalog = await getProducts(COMPANY_ID);
        }
      } catch (err) {
        console.error('Error fetching catalog:', err);
      } finally {
        setTimeout(() => {
          if (shimmerEl) shimmerEl.classList.add('hidden');
          if (boxEl) boxEl.classList.remove('hidden');
          if (badgeEl) badgeEl.classList.add('hidden');

          addProductRow();
          recalculateSummary();
        }, 300);
      }
    }

    // Add Product Row (Flexbox Proportions matching Screenshot)
    window.addProductRow = function() {
      const container = document.getElementById('product-rows-container');
      if (!container) return;

      rowCounter++;
      const rowId = `row-${rowCounter}`;

      const rowEl = document.createElement('div');
      rowEl.id = rowId;
      rowEl.className = 'flex items-center gap-2';

      let productOptions = `<option value="">Select a product...</option>`;
      catalog.forEach(prod => {
        productOptions += `<option value="${prod.id}">${prod.name}</option>`;
      });

      rowEl.innerHTML = `
        <div class="flex-[5] min-w-0">
          <select class="custom-select prod-select text-xs truncate" onchange="handleProductChange('${rowId}')" required>
            ${productOptions}
          </select>
        </div>

        <div class="flex-[2.5] min-w-0">
          <select class="custom-select size-select text-xs truncate" onchange="handleVariantChange('${rowId}')" required>
            <option value="M">M</option>
          </select>
        </div>

        <div class="flex-[2] min-w-0">
          <input type="number" class="custom-input qty-input text-xs text-center !px-1 font-semibold" value="1" min="1" max="50" oninput="recalculateSummary()" required>
        </div>

        <div class="w-9 shrink-0 flex justify-center">
          <button type="button" onclick="removeProductRow('${rowId}')" class="h-10 w-9 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center transition-colors cursor-pointer text-xs" title="Remove Item">
            ✕
          </button>
        </div>
      `;

      container.appendChild(rowEl);

      // Default select first product if available
      if (catalog.length > 0) {
        const select = rowEl.querySelector('.prod-select');
        if (select && select.options.length > 1) {
          select.selectedIndex = 1;
          handleProductChange(rowId);
        }
      }
    };

    // Remove Product Row
    window.removeProductRow = function(rowId) {
      const container = document.getElementById('product-rows-container');
      const rows = container.querySelectorAll('[id^="row-"]');
      if (rows.length <= 1) {
        alert('An order must contain at least 1 product.');
        return;
      }
      const el = document.getElementById(rowId);
      if (el) el.remove();
      recalculateSummary();
    };

    // When Product changes, populate Sizes & Variants
    window.handleProductChange = function(rowId) {
      const row = document.getElementById(rowId);
      if (!row) return;

      const prodSelect = row.querySelector('.prod-select');
      const sizeSelect = row.querySelector('.size-select');
      const prodId = prodSelect.value;
      const product = catalog.find(p => String(p.id) === String(prodId));

      sizeSelect.innerHTML = '';

      if (product && Array.isArray(product.variants) && product.variants.length > 0) {
        product.variants.forEach(v => {
          const sizeName = v.size || v.name || 'Standard';
          const price = Number(v.price || product.price || 0);
          const opt = document.createElement('option');
          opt.value = v.size || sizeName;
          opt.dataset.price = price;
          opt.dataset.color = v.color || '';
          opt.dataset.variantKey = v.id || `${v.size}::${v.color}`;
          opt.textContent = sizeName;
          sizeSelect.appendChild(opt);
        });
      } else {
        const price = Number(product?.price || 0);
        const opt = document.createElement('option');
        opt.value = 'M';
        opt.dataset.price = price;
        opt.textContent = 'M';
        sizeSelect.appendChild(opt);
      }

      recalculateSummary();
    };

    window.handleVariantChange = function(rowId) {
      recalculateSummary();
    };

    // Payment Method Selection
    window.setPaymentMethod = function(method) {
      activePaymentMethod = method;
      const buttons = document.querySelectorAll('#payment-method-group .pay-pill');
      buttons.forEach(btn => {
        if (btn.dataset.method === method) {
          btn.className = 'pay-pill px-4 h-9 rounded-xl text-xs font-bold transition-all bg-black text-white shadow-xs';
        } else {
          btn.className = 'pay-pill px-4 h-9 rounded-xl text-xs font-medium transition-all bg-white text-slate-700 border border-slate-200 hover:bg-slate-50';
        }
      });
    };

    // Recalculate Subtotal, Delivery, Discount, Total
    window.recalculateSummary = function() {
      let subtotal = 0;
      const rows = document.querySelectorAll('#product-rows-container [id^="row-"]');

      rows.forEach(row => {
        const prodSelect = row.querySelector('.prod-select');
        const sizeSelect = row.querySelector('.size-select');
        const qtyInput = row.querySelector('.qty-input');

        const qty = Math.max(1, Number(qtyInput?.value || 1));
        const selectedOpt = sizeSelect?.selectedOptions[0];
        let price = Number(selectedOpt?.dataset?.price);

        if (isNaN(price) || price <= 0) {
          const prodId = prodSelect?.value;
          const prod = catalog.find(p => String(p.id) === String(prodId));
          price = Number(prod?.price || 0);
        }

        subtotal += (price * qty);
      });

      const delivery = Math.max(0, Number(document.getElementById('delivery-charge')?.value || 0));
      const discount = Math.max(0, Number(document.getElementById('discount-amount')?.value || 0));
      const total = Math.max(0, subtotal + delivery - discount);

      document.getElementById('summary-subtotal').textContent = `₹${subtotal.toLocaleString('en-IN')}`;
      document.getElementById('summary-delivery').textContent = `₹${delivery.toLocaleString('en-IN')}`;
      document.getElementById('summary-discount').textContent = `-₹${discount.toLocaleString('en-IN')}`;
      document.getElementById('summary-total').textContent = `₹${total.toLocaleString('en-IN')}`;

      return { subtotal, delivery, discount, total };
    };

    // Authentic iOS Chime on Order Created
    function playIosChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume().catch(() => {});
          const notes = [
            { freq: 659.25, time: 0, dur: 0.18 },
            { freq: 830.61, time: 0.11, dur: 0.20 },
            { freq: 1046.50, time: 0.22, dur: 0.36 }
          ];
          notes.forEach(n => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(n.freq, ctx.currentTime + n.time);
            gain.gain.setValueAtTime(0, ctx.currentTime + n.time);
            gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + n.time + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n.time + n.dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + n.time);
            osc.stop(ctx.currentTime + n.time + n.dur);
          });
          setTimeout(() => { try { ctx.close(); } catch(_) {} }, 1000);
        }
      } catch(_) {}
    }

    // Submit Order
    window.handleOrderSubmit = async function(e) {
      e.preventDefault();

      const btn = document.getElementById('save-order-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="material-symbols-outlined text-sm animate-spin">sync</span> Saving Order...`;
      }

      try {
        const name = document.getElementById('customer-name').value.trim();
        const phone = document.getElementById('customer-phone').value.trim().replace(/\D/g, '').slice(-10);
        const address = document.getElementById('customer-address').value.trim();

        if (!name || phone.length < 10 || !address) {
          alert('Please provide customer name, a valid 10-digit phone number, and delivery address.');
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<span>Save Order</span>`;
          }
          return;
        }

        const items = [];
        const rows = document.querySelectorAll('#product-rows-container [id^="row-"]');

        rows.forEach(row => {
          const prodSelect = row.querySelector('.prod-select');
          const sizeSelect = row.querySelector('.size-select');
          const qtyInput = row.querySelector('.qty-input');

          const prodId = prodSelect.value;
          const product = catalog.find(p => String(p.id) === String(prodId));
          const opt = sizeSelect.selectedOptions[0];

          const size = opt ? opt.value : 'M';
          const color = opt?.dataset?.color || 'Default';
          const price = Number(opt?.dataset?.price || product?.price || 0);
          const qty = Math.max(1, Number(qtyInput.value || 1));
          const imgUrl = (Array.isArray(product?.imageUrls) ? product.imageUrls[0] : product?.imageUrl) || '';

          if (prodId) {
            items.push({
              productId: prodId,
              name: product?.name || 'Apparel Item',
              size: size,
              color: color,
              price: price,
              quantity: qty,
              subtotal: price * qty,
              imageUrl: imgUrl,
              variantKey: opt?.dataset?.variantKey || `${size}::${color}`
            });
          }
        });

        if (items.length === 0) {
          alert('Please select at least one product.');
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<span>Save Order</span>`;
          }
          return;
        }

        const { subtotal, delivery, discount, total } = recalculateSummary();
        const orderId = `ORD-${Date.now()}-${Math.floor(1000 + Math.random() * 9000)}`;

        const orderPayload = {
          orderId: orderId,
          companyId: COMPANY_ID,
          branchId: 'online',
          customerName: name,
          customerPhone: phone,
          customerPhoneNumber: phone,
          customerAddress: address,
          shippingAddress: address,
          items: items,
          subtotal: subtotal,
          deliveryFee: delivery,
          shippingCharge: delivery,
          discountAmount: discount,
          totalAmount: total,
          paymentMethod: activePaymentMethod === 'COD' ? 'Cash on Delivery (COD)' : `${activePaymentMethod} Online`,
          paymentStatus: activePaymentMethod === 'COD' ? 'Pending' : 'Paid',
          orderStatus: 'Awaiting Acceptance',
          status: 'Awaiting Acceptance',
          orderType: 'online',
          customerSource: 'website',
          source: 'manual',
          channel: 'manual_order',
          createdAt: new Date().toISOString()
        };

        const result = await saveOrderToFirestore(orderPayload);
        if (!result || result.success === false) {
          throw new Error(result?.error || 'Database save failed');
        }

        playIosChime();
        alert(`Order #${orderId} created successfully!`);
        window.location.href = 'orders.html';

      } catch (err) {
        console.error('Error saving manual order:', err);
        alert(err.message || 'Unable to save order. Please check connection and try again.');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>Save Order</span>`;
        }
      }
    };

    // Run on load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }
  </script>
</body>
</html>
